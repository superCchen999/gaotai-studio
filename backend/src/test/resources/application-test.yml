spring:
  datasource:
    url: jdbc:h2:mem:gaotai;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/001_schema.sql
      data-locations: classpath:db/002_seed.sql

studio:
  worker:
    enabled: false
  storage:
    root: ${java.io.tmpdir}/gaotai-test
  simulator:
    api-enabled: false
    step-delay-ms: 0
    fail-stage: NONE
